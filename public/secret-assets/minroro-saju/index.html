.minroro-reviews {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-height: 0;
  height: 100%;
  max-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding: 8px 18px 18px;
  color: #f8faf8;
  font-family: inherit;
  scrollbar-width: thin;
  scrollbar-color: #37463b transparent;
}
.minroro-reviews:focus { outline: none; }
.minroro-reviews:focus-visible { outline: 2px solid #39f330; outline-offset: -3px; }
.minroro-reviews *, .minroro-reviews *::before, .minroro-reviews *::after { box-sizing: border-box; }
.minroro-reviews__heading { margin: 0 0 20px; text-align: center; }
.minroro-reviews__eyebrow { margin: 0 0 7px; color: #39f330; font-size: 11px; line-height: 1.4; font-weight: 700; letter-spacing: .06em; }
.minroro-reviews__heading h2 { margin: 0; font-size: clamp(22px, 5.6vw, 27px); font-weight: 800; line-height: 1.32; letter-spacing: -.035em; color: #fff; word-break: keep-all; }
.minroro-reviews__list { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
.minroro-review-card { flex: 0 0 auto; margin: 0; padding: 15px 16px; border: 1px solid #ffffff1a; border-radius: 14px; background: #151b17; }
.minroro-review-card__header { display: flex; align-items: center; gap: 12px; }
.minroro-review-card__avatar { flex: 0 0 48px; width: 48px; height: 48px; overflow: hidden; border-radius: 50%; background: #222e25; display: grid; place-items: center; color: #8a9b8e; font-size: 15px; font-weight: 700; line-height: 1; }
.minroro-review-card__avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.minroro-review-card__identity { min-width: 0; flex: 1; }
.minroro-review-card__name { margin: 0 0 5px; color: #a9b2ab; font-size: 11px; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; }
.minroro-review-card__headline { margin: 0; color: #fff; font-size: 17px; line-height: 1.38; font-weight: 800; letter-spacing: -.025em; white-space: pre-line; overflow-wrap: anywhere; word-break: keep-all; }
.minroro-review-card--empty .minroro-review-card__headline { color: #d4dbd6; font-size: 15px; font-weight: 600; }
.minroro-review-card__body { margin: 13px 0 0; color: #bac4bd; font-size: 13px; line-height: 1.75; font-weight: 400; letter-spacing: -.01em; white-space: pre-line; overflow-wrap: anywhere; word-break: keep-all; }
.minroro-review-card__placeholder { display: flex; flex-direction: column; gap: 7px; margin-top: 13px; }
.minroro-review-card__placeholder span { display: block; height: 6px; border-radius: 3px; background: #ffffff0b; }
.minroro-review-card__placeholder span:nth-child(1) { width: 94%; }
.minroro-review-card__placeholder span:nth-child(2) { width: 86%; }
.minroro-review-card__placeholder span:nth-child(3) { width: 90%; }
.minroro-review-card__placeholder span:nth-child(4) { width: 62%; }
.minroro-review-card__screenshot { display: block; width: 100%; height: auto; margin-top: 14px; border-radius: 8px; object-fit: contain; }
@media (max-width: 360px) {
  .minroro-reviews { padding-inline: 12px; }
  .minroro-review-card { padding-inline: 13px; }
  .minroro-review-card__header { gap: 10px; }
  .minroro-review-card__headline { font-size: 16px; }
  .minroro-review-card--empty .minroro-review-card__headline { font-size: 14px; }
}
@media (max-height: 720px) {
  .minroro-reviews__heading { margin-bottom: 15px; }
}

<script id="minroro-templates" type="application/json">{"title":"\u003csection class=\"mg-title-screen\">\u003cdiv class=\"mg-title-copy\">\u003cp class=\"mg-kicker\">AI 블로그 수익화\u003c/p>\u003ch1 tabindex=\"-1\">하루 \u003cstrong>30\u003c/strong>분,\u003cbr>\u003cem>월 \u003cstrong>300\u003c/strong>만원 도전\u003c/em>\u003c/h1>\u003cp class=\"mg-title-sub\">AI 블로그로 시작하는\u003cbr>나의 수익화 미션.\u003c/p>\u003c/div>\u003cdiv class=\"mg-title-bottom\">\u003cp class=\"mg-course\">AI 블로그 수익화 정답지\u003cspan>10/23(금) 저녁 7:30 · 무료 온라인 LIVE\u003c/span>\u003c/p>\u003cbutton type=\"button\" class=\"mg-primary mg-start\">월 300만원 미션 시작 \u003cb aria-hidden=\"true\">▸\u003c/b>\u003c/button>\u003cbutton type=\"button\" class=\"mg-text-button\">바로 수익화 미션 시작하기\u003c/button>\u003cp class=\"mg-fiction\">월 300만원은 도전 목표이며 수익을 보장하지 않습니다. 입금 알림은 연출입니다.\u003c/p>\u003c/div>\u003c/section>","story":"\u003csection class=\"mg-story-ui\">\u003cp class=\"mg-place\">\u003cspan>\u003c/span>월 300만원 수익화 미션\u003c/p>\u003cdiv class=\"mg-dialogue\">\u003cspan class=\"mg-speaker\">민로로\u003c/span>\u003ch2 tabindex=\"-1\" class=\"mg-sr-only\">월 300만원 수익화 미션\u003c/h2>\u003cp class=\"mg-story-line\">\u003cspan aria-hidden=\"true\">하루 30분부터 시작해볼까요?\n목표는 월 300만원, 나에게 맞는 방법을 찾는 거예요.\u003cspan class=\"mg-caret mg-caret-done\">\u003c/span>\u003c/span>\u003cspan class=\"mg-sr-only\">하루 30분부터 시작해볼까요?\n목표는 월 300만원, 나에게 맞는 방법을 찾는 거예요.\u003c/span>\u003c/p>\u003cdiv class=\"mg-dialogue-bottom\">\u003cspan class=\"mg-scene-dots\" aria-label=\"이야기 3 / 5\">\u003ci class=\"mg-dot-active\">\u003c/i>\u003ci class=\"mg-dot-active\">\u003c/i>\u003ci class=\"mg-dot-active\">\u003c/i>\u003ci class=\"\">\u003c/i>\u003ci class=\"\">\u003c/i>\u003c/span>\u003cbutton type=\"button\" class=\"mg-next\">다음\u003cb class=\"mg-next-indicator\" aria-hidden=\"true\">▸\u003c/b>\u003c/button>\u003c/div>\u003c/div>\u003cbutton type=\"button\" class=\"mg-skip\">이야기 건너뛰기\u003c/button>\u003c/section>","reviews":"\u003csection class=\"mg-reviews-ui\">\u003ch2 tab en=\"true\">\u003cspan>03\u003c/span>\u003c/div>\u003cdiv class=\"minroro-review-card__identity\">\u003cp class=\"minroro-review-card__name\">후기 03\u003c/p>\u003ch3 class=\"minroro-review-card__headline\">후기를 넣을 자리입니다\u003c/h3>\u003c/div>\u003c/div>\u003cdiv class=\"minroro-review-card__placeholder\" aria-hidden=\"true\">\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003c/article>\u003c/li>\u003c/ol>\u003c/section>\u003c/div>\u003cdiv class=\"mg-reviews-actions\">\u003cbutton type=\"button\" class=\"mg-primary\">수익화 미션 시작하기 \u003cb aria-hidden=\"true\">▸\u003c/b>\u003c/button>\u003c/div>\u003c/section>","q1":"\u003csection class=\"mg-question-ui\">\u003cdiv class=\"mg-dialogue mg-question-dialogue\">\u003cspan class=\"mg-speaker\">민로로\u003c/span>\u003cp class=\"mg-dialogue-label\">나에게 맞는 수익화 미션을 찾아볼까요?\u003c/p>\u003ch2 tabindex=\"-1\">블로그, 해보셨어요?\u003c/h2>\u003cp class=\"mg-question-note\">지금의 출발점부터 알아볼게요.\u003c/p>\u003cdiv class=\"mg-choices\" aria-label=\"블로그, 해보셨어요?\">\u003cbutton type=\"button\" aria-pressed=\"false\" class=\"mg-choice\">\u003cspan>01\u003c/span>\u003cstrong>처음이에요\u003c/strong>\u003cb aria-hidden=\"true\">›\u003c/b>\u003c/button>\u003cbutton type=\"button\" aria-pressed=\"false\" class=\"mg-choice\">\u003cspan>02\u003c/span>\u003cstrong>해봤는데 0원\u003c/strong>\u003cb aria-hidden=\"true\">›\u003c/b>\u003c/button>\u003cbutton type=\"button\" aria-pressed=\"false\" class=\"mg-choice\">\u003cspan>03\u003c/span>\u003cstrong>체험단만 해요\u003c/strong>\u003cb aria-hidden=\"true\">›\u003c/b>\u003c/button>\u003cbutton type=\"button\" aria-pressed=\"false\" class=\"mg-choice\">\u003cspan>04\u003c/span>\u003cstrong>가게 사장이에요\u003c/strong>\u003cb aria-hidden=\"true\">›\u003c/b>\u003c/button>\u003c/div>\u003cp class=\"mg-choice-hint\">선택하면 다음 장면으로 이어져요.\u003c/p>\u003c/div>\u003c/section>","form":"\u003csection class=\"mg-contact-ui\">\u003cdiv class=\"mg-dialogue mg-contact-dialogue\">\u003cspan class=\"mg-speaker\">민로로\u003c/span>\u003cdiv class=\"mg-contact-scroll\">\u003cp class=\"mg-dialogue-label\">수익화 미션을 함께 준비해요.\u003c/p>\u003ch2 tabindex=\"-1\">나의 수익화 미션, 다음 단계로.\u003c/h2>\u003cp class=\"mg-form-notice\">\u003cstrong>실제 접수 없는 시안\u003c/strong> · 가상 정보로 확인해주세요.\u003cbr>예: 테스트이름 / 01000000000\u003c/p>\u003cform noValidate>\u003cdiv class=\"mg-form-row\">\u003clabel for=\"static-qa-name\">이름\u003c/label>\u003cinput id=\"static-qa-name\" name=\"preview-name\" autoComplete=\"off\" placeholder=\"가상 이름 두 글자 이상\" maxLength=\"40\" value=\"\" aria-required=\"true\" aria-invalid=\"false\">\u003c/div>\u003cdiv class=\"mg-form-row\">\u003clabel for=\"static-qa-phone\">휴대폰 번호\u003c/label>\u003cinput id=\"static-qa-phone\" name=\"preview-phone\" type=\"tel\" inputMode=\"numeric\" autoComplete=\"off\" placeholder=\"01000000000\" maxLength=\"13\" value=\"\" aria-required=\"true\" aria-invalid=\"false\">\u003c/div>\u003clabel class=\"mg-consent\">\u003cinput type=\"checkbox\" aria-required=\"true\" aria-invalid=\"false\">\u003cspan>개인정보 수집·이용 동의 \u003csmall>필수 · 예시\u003c/small>\u003c/span>\u003c/label>\u003cp class=\"mg-consent-note\">동의 문구 검토용 시안입니다. 입력 정보는 수집·전송되지 않으며, 실제 운영 전 목적·항목·보유 기간·거부 안내를 확정합니다.\u003c/p>\u003clabel class=\"mg-consent\">\u003cinput type=\"checkbox\">\u003cspan>강의·혜택 안내 수신 \u003csmall>선택 · 예시\u003c/small>\u003c/span>\u003c/label>\u003cbutton type=\"submit\" class=\"mg-primary\">완료 장면 확인하기 \u003cb aria-hidden=\"true\">▸\u003c/b>\u003c/button>\u003cp class=\"mg-form-footnote\">정보 저장·실제 신청·알림 발송은 이루어지지 않습니다.\u003c/p>\u003c/form>\u003c/div>\u003c/div>\u003c/section>","complete":"\u003csection class=\"mg-complete-ui\">\u003cdiv class=\"mg-dialogue mg-complete-dialogue\">\u003cspan class=\"mg-speaker\">민로로\u003c/span>\u003cp class=\"mg-dialogue-label\">TO BE CONTINUED\u003c/p>\u003ch2 tabindex=\"-1\">월 300만원 목표,\u003cbr>\u003cem>도전은 지금부터.\u003c/em>\u003c/h2>\u003cp class=\"mg-complete-line\">「AI 블로그 수익화 정답지」\u003cbr>\u003cstrong>10/23(금) 저녁 7:30\u003c/strong> · 한국시간\u003cbr>무료 온라인 LIVE\u003c/p>\u003cp class=\"mg-benefit\">\u003c/p>\u003cp class=\"mg-complete-notice\">신청이 완료됐어요.\u003cbr>라이브 안내는 알림톡으로 보내 드려요.\u003c/p>\u003cbutton type=\"button\" class=\"mg-primary\">수익화 미션 처음으로 \u003cb aria-hidden=\"true\">↺\u003c/b>\u003c/button>\u003c/div>\u003c/section>"}</script>
<script id="minroro-assets" type="application/json">{"story-c1.jpg":"./story-c1.jpg","story-c1.mp4":"./story-c1.mp4","story-c2.jpg":"./story-c2.jpg","story-c2.mp4":"./story-c2.mp4","story-c3.jpg":"./story-c3.jpg","story-c3.mp4":"./story-c3.mp4","story-c4.jpg":"./story-c4.jpg","story-c4.mp4":"./story-c4.mp4","story-c5.jpg":"./story-c5.jpg","story-c5.mp4":"./story-c5.mp4"}</script>
<script>(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('minroro-catalog').textContent);
  const TEMPLATES = JSON.parse(document.getElementById('minroro-templates').textContent);
  const ASSETS = JSON.parse(document.getElementById('minroro-assets').textContent);
  const REVIEWS = JSON.parse(document.getElementById('minroro-review-data').textContent);
  const STORIES = DATA.stories, QUIZ_QUESTIONS = DATA.questions, INVITATION = DATA.invitation;
  // 웹 연동(아마겟돈 클래스): 후기 3칸이 모두 비어 있으면 후기 화면을 건너뛴다
  const HAS_REVIEWS = REVIEWS.some(r => String(r.name||'').trim() || String(r.headline||'').trim() || String(r.body||'').trim() || String(r.testimonialImageUrl||'').trim());
  // 웹 연동: 신청은 부모 페이지(카카오 로그인 → 무료 신청 → 전환 추적)가 하고, 끝나면 'amag-saju:done' 을 보내 완료 화면으로 넘긴다
  let applying = false;
  function apply(answersNow) { if(applying) return; applying = true; setApplying(true); try { window.parent.postMessage({ type: 'amag-saju:apply', answers: answersNow }, location.origin); } catch { applying = false; setApplying(false); } }
  function setApplying(on) { const cta = document.querySelector('.mg-invite-footer .mg-primary'); if(!cta) return; cta.disabled = on; cta.firstChild.nodeValue = on ? '신청하는 중… ' : '무료 강의 신청하기 '; }
  function validateQuizContact(contact             )                    {
  const errors                    = {}
  if (contact.name.trim().length < 2) errors.name = '이름을 두 글자 이상 입력해주세요. 가상 이름도 괜찮아요.'
  if (!/^010\d{8}$/.test(contact.phone)) errors.phone = '010으로 시작하는 11자리 번호를 입력해주세요.'
  if (!contact.requiredConsent) errors.requiredConsent = '필수 동의 항목을 확인해주세요. 현재는 동의 화면 시안입니다.'
  return errors
}
  const stage = document.getElementById('mg-stage');
  const screen = document.getElementById('mg-screen');
  const mediaHost = document.getElementById('mg-media-host');
  const previousImage = document.getElementById('mg-previous');
  const decoration = document.getElementById('mg-decoration');
  const nav = document.querySelector('.mg-top-nav');
  const backButton = nav.querySelector('button:first-child');
  const homeButton = nav.querySelector('button:last-child');
  const progress = nav.querySelector('.mg-progress-label');
  const query = matchMedia('(prefers-reduced-motion: reduce)');
  const blank = () => ({ name: '', phone: '', requiredConsent: false, marketingConsent: false });
  let step = -1, storyPage = 0, answers = {}, contact = blank(), motion = !query.matches;
  let currentScene = null, mediaMotion = null, activeVideo = null;
  let frame = 0, typing = false, finishTyping = null, lastAction = -Infinity;
  const sceneFor = value => value < 0 ? 1 : value <= 4 ? STORIES[value].scene : value >= 5 && value <= 7 ? 3 : value === 8 ? 3 : 5;
  const posterFor = scene => ASSETS['story-c' + scene + '.jpg'];
  function make(tag, className, text) { const node = document.createElement(tag); if(className) node.className=className; if(text !== undefined) node.textContent=text; return node; }
  function permit(event) { if(event && event.detail > 1) return false; const now=performance.now(); if(now-lastAction<190) return false; lastAction=now; return true; }
  function updateMedia(scene) {
    if(scene === currentScene && mediaMotion === motion) return;
    previousImage.src=posterFor(currentScene || scene);
    if(activeVideo) { activeVideo.pause(); activeVideo.removeAttribute('src'); activeVideo.load(); }
    currentScene=scene; mediaMotion=motion; activeVideo=null;
    const media=make('div','mg-media');
    const image=make('img','mg-scene-image'); image.src=posterFor(scene); image.alt=''; image.width=1080; image.height=1920;
    media.append(image);
    if(motion) {
      const video=make('video','mg-scene-video'); video.muted=true; video.defaultMuted=true; video.autoplay=true; video.loop=true; video.playsInline=true; video.preload='auto';
      video.setAttribute('muted',''); video.setAttribute('autoplay',''); video.setAttribute('loop',''); video.setAttribute('playsinline',''); video.setAttribute('aria-hidden','true');
      video.poster=posterFor(scene); video.src=ASSETS['story-c'+scene+'.mp4'];
      video.addEventListener('playing',()=>video.classList.add('mg-video-ready'));
      video.addEventListener('error',()=>video.classList.remove('mg-video-ready'));
      media.append(video); activeVideo=video;
    }
    mediaHost.replaceChildren(media);
    if(activeVideo) activeVideo.play().catch(()=>{});
  }
  function updateAtmosphere() {
    decoration.replaceChildren();
    if(!motion) return;
    const atmosphere=make('div','mg-atmosphere'); atmosphere.setAttribute('aria-hidden','true'); atmosphere.append(make('div','mg-light-sweep'));
    for(let index=0;index<10;index++){const particle=make('i');Object.assign(particle.style,{left:(8+(index*29)%85)+'%',top:(12+(index*17)%70)+'%',animationDelay:(index*-.8)+'s',animationDuration:(7+index%4)+'s'});atmosphere.append(particle)}
    decoration.append(atmosphere);
  }
  function deposit() {
    const group=make('div','mg-income-group'+(step===4?' mg-income-final':'')); group.setAttribute('aria-label','이야기 속 입금 알림 연출');
    const card=make('div','mg-deposit-card'); const icon=make('span','mg-deposit-icon','₩');icon.setAttribute('aria-hidden','true');
    const copy=make('div','mg-deposit-copy'); copy.append(make('span','','입금 알림 · 방금'),make('strong','',DATA.depositTitle));
    const small=make('small','','입금 완료 ');const check=make('b','','✓');check.setAttribute('aria-hidden','true');small.append(check);copy.append(small);card.append(icon,copy);group.append(card);screen.append(group);
  }
  function setScreen(template) { screen.innerHTML=TEMPLATES[template]; }
  function go(value, page=0) { cancelAnimationFrame(frame);typing=false;finishTyping=null;step=value;storyPage=page;render(); }
  function next(event) { if(!permit(event))return;if(typing){finishTyping();return}if(step>=0&&step<=4&&storyPage<STORIES[step].pages.length-1){go(step,storyPage+1);return}if(step===4)go(HAS_REVIEWS?4.5:5);else if(step<5)go(step+1); }
  function home() { answers={};contact=blank();go(-1); }
  function back() { if(step>=0&&step<=4&&storyPage>0){go(step,storyPage-1);return}if(step>-1){const previous=step===5?(HAS_REVIEWS?4.5:4):step===4.5?4:step-1;go(previous,previous>=0&&previous<=4?STORIES[previous].pages.length-1:0)} }
  function button(selector, action) { const node=screen.querySelector(selector);if(node)node.addEventListener('click',action);return node; }
  function setStory() {
    const story=STORIES[step],storyText=story.pages[storyPage];setScreen('story');
    const storySection=screen.querySelector('.mg-story-ui');storySection.dataset.storyPage=String(storyPage+1);storySection.dataset.storyPages=String(story.pages.length);
    const place=screen.querySelector('.mg-place');place.replaceChildren(make('span'),document.createTextNode(story.place));
    screen.querySelector('.mg-speaker').textContent=story.speaker;
    screen.querySelector('h2').textContent=story.place;
    const line=screen.querySelector('.mg-story-line');line.replaceChildren();
    const visible=make('span');visible.setAttribute('aria-hidden','true');const text=document.createTextNode('');const caret=make('span','mg-caret');visible.append(text,caret);
    line.append(visible,make('span','mg-sr-only',storyText));
    const dots=screen.querySelector('.mg-scene-dots');dots.setAttribute('aria-label',`이야기 ${step+1} / 5`);Array.from(dots.children).forEach((dot,index)=>dot.classList.toggle('mg-dot-active',index<=step));
    if(story.pages.length>1){const pageLabel=make('span','mg-dialogue-pages',`${storyPage+1} / ${story.pages.length}`);pageLabel.setAttribute('aria-label',`대사 ${storyPage+1} / ${story.pages.length}`);dots.after(pageLabel)}
    const nextButton=button('.mg-next',next);const indicator=nextButton.querySelector('b');
    const label=document.createTextNode('');nextButton.replaceChildren(label,indicator);
    const tap=make('button','mg-scene-tap');tap.type='button';tap.addEventListener('click',next);screen.prepend(tap);
    button('.mg-skip',()=>go(5));
    const finishedLabel=storyPage<story.pages.length-1?'다음 대사':step===4?'다음 이야기':'다음';
    finishTyping=()=>{cancelAnimationFrame(frame);text.nodeValue=storyText;typing=false;caret.classList.add('mg-caret-done');label.nodeValue=finishedLabel;tap.setAttribute('aria-label',storyPage<story.pages.length-1?'다음 대사':step===4?'다음 이야기':'다음 장면')};
    if(!motion){finishTyping();return}
    typing=true;label.nodeValue='대사 보기';tap.setAttribute('aria-label','대사 바로 보기');
    const glyphs=Array.from(storyText),start=performance.now();
    const tick=now=>{const count=Math.min(glyphs.length,Math.floor((now-start)/26)+1);text.nodeValue=glyphs.slice(0,count).join('');if(count<glyphs.length)frame=requestAnimationFrame(tick);else finishTyping()};
    frame=requestAnimationFrame(tick);
  }
  function setQuestion() {
    const question=QUIZ_QUESTIONS[step-5];setScreen('q1');
    screen.querySelector('h2').textContent=question.title;
    screen.querySelector('.mg-dialogue-label').textContent='나에게 맞는 수익화 미션을 찾아볼까요?';
    const description=screen.querySelector('.mg-question-note');if(question.description)description.textContent=question.description;else description.remove();
    const choices=screen.querySelector('.mg-choices');choices.classList.toggle('mg-choices-long',question.id==='course');choices.setAttribute('aria-label',question.title);choices.replaceChildren();
    question.options.forEach((option,index)=>{
      const selected=answers[question.id]===option.value,node=make('button','mg-choice'+(selected?' mg-selected':''));node.type='button';node.setAttribute('aria-label',option.label);node.setAttribute('aria-pressed',String(selected));
      const number=make('span','',String(index+1).padStart(2,'0')),copy=make('span','mg-choice-copy');copy.append(make('strong','',option.shortLabel||option.label));if(option.hint)copy.append(make('small','',option.hint));const arrow=make('b','',selected?'✓':'›');arrow.setAttribute('aria-hidden','true');node.append(number,copy,arrow);
      node.addEventListener('click',event=>{if(!permit(event))return;answers[question.id]=option.value;go(step+1)});choices.append(node);
    });
  }
  function setReviews() {
    setScreen('reviews');
    const list=screen.querySelector('.minroro-reviews__list');const pristine=Array.from(list.children).map(node=>node.cloneNode(true));list.replaceChildren();
    REVIEWS.slice(0,3).forEach((review,index)=>{
      const card=pristine[index]||pristine[0].cloneNode(true),name=String(review.name||'').trim(),headline=String(review.headline||'').trim(),body=String(review.body||'').trim();
      const avatar=String(review.avatarUrl||'').trim(),capture=String(review.testimonialImageUrl||'').trim(),isEmpty=!name&&!headline&&!body&&!capture;
      card.classList.toggle('minroro-review-card--empty',isEmpty);card.querySelector('article').setAttribute('aria-label',isEmpty?`후기 ${String(index+1).padStart(2,'0')} 입력 자리`:`${name||'수강생'} 후기`);
      card.querySelector('.minroro-review-card__name').textContent=name||`후기 ${String(index+1).padStart(2,'0')}`;
      card.querySelector('.minroro-review-card__headline').textContent=headline||(isEmpty?'후기를 넣을 자리입니다':'수강생 후기');
      const avatarBox=card.querySelector('.minroro-review-card__avatar');avatarBox.replaceChildren(make('span','',name?Array.from(name)[0]:String(index+1).padStart(2,'0')));
      if(/^data:image\//.test(avatar)){const img=make('img');img.src=avatar;img.alt='';avatarBox.replaceChildren(img)}
      if(!isEmpty)card.querySelector('.minroro-review-card__placeholder')?.remove();
      if(body)card.querySelector('article').append(make('p','minroro-review-card__body',body));
      if(/^data:image\//.test(capture)){const img=make('img','minroro-review-card__screenshot');img.src=capture;img.alt=(name||'수강생')+'의 후기 캡처';card.querySelector('article').append(img)}
      list.append(card);
    });
    button('.mg-reviews-actions button',()=>go(5));
  }
  function setInvitation() {
    screen.replaceChildren();const section=make('section','mg-invite-ui'),panel=make('div','mg-dialogue mg-invite-dialogue');panel.append(make('span','mg-speaker','민로로'));
    const scroll=make('div','mg-invite-scroll'),heading=make('h2','',INVITATION.heading);heading.tabIndex=-1;scroll.append(heading);
    const copy=make('div','mg-invite-copy');INVITATION.paragraphs.forEach(paragraph=>copy.append(make('p','',paragraph)));scroll.append(copy);
    const benefits=make('div','mg-invite-benefits');benefits.append(make('h3','',INVITATION.benefitsHeading));const list=make('ul');INVITATION.benefits.forEach(benefit=>list.append(make('li','','- '+benefit)));benefits.append(list,make('p','',INVITATION.more));scroll.append(benefits);
    const footer=make('div','mg-invite-footer'),cta=make('button','mg-primary','무료 강의 신청하기 ');cta.type='button';const arrow=make('b','','▸');arrow.setAttribute('aria-hidden','true');cta.append(arrow);cta.addEventListener('click',()=>apply(Object.assign({},answers)));footer.append(cta);panel.append(scroll,footer);section.append(panel);screen.append(section);
  }
  function setCompletion() {
    setScreen('complete');const benefits=screen.querySelector('.mg-benefit');benefits.replaceChildren(document.createTextNode(INVITATION.benefitsHeading),document.createElement('br'));const list=make('b');INVITATION.benefits.forEach(benefit=>list.append(make('span','','- '+benefit)));benefits.append(list,make('span','',INVITATION.more));button('.mg-primary',home);
  }
  function setForm() {
    setScreen('form');const form=screen.querySelector('form');form.noValidate=true;
    const name=form.querySelector('input[name="preview-name"]'),phone=form.querySelector('input[name="preview-phone"]'),checks=form.querySelectorAll('input[type="checkbox"]');
    const required=checks[0],marketing=checks[1];name.value=contact.name;phone.value=contact.phone;required.checked=contact.requiredConsent;marketing.checked=contact.marketingConsent;
    function clear(field,node){form.querySelector('[data-error="'+field+'"]')?.remove();node.setAttribute('aria-invalid','false');node.removeAttribute('aria-describedby')}
    function show(field,node,text){clear(field,node);const error=make('p','mg-error',text);error.dataset.error=field;error.id='export-error-'+field;error.setAttribute('role','alert');node.setAttribute('aria-invalid','true');node.setAttribute('aria-describedby',error.id);if(field==='requiredConsent')node.closest('label').after(error);else node.after(error)}
    name.addEventListener('input',()=>{contact.name=name.value;clear('name',name)});
    phone.addEventListener('input',()=>{phone.value=phone.value.replace(/\D/g,'').slice(0,11);contact.phone=phone.value;clear('phone',phone)});
    required.addEventListener('change',()=>{contact.requiredConsent=required.checked;clear('requiredConsent',required)});
    marketing.addEventListener('change',()=>{contact.marketingConsent=marketing.checked});
    form.addEventListener('submit',event=>{
      event.preventDefault();contact={name:name.value,phone:phone.value,requiredConsent:required.checked,marketingConsent:marketing.checked};
      const errors=validateQuizContact(contact),nodes={name,phone,requiredConsent:required};
      Object.entries(nodes).forEach(([field,node])=>{clear(field,node);if(errors[field])show(field,node,errors[field])});
      const first=Object.keys(errors)[0];if(first){nodes[first].focus();return}contact=blank();go(10);
    });
  }
  function render() {
    const scene=sceneFor(step);stage.className='mg-stage mg-step-'+step+(motion?' mg-motion':'')+(step===4.5?' mg-reviews-active':'')+(step>=5&&step<=7?' mg-questions-active':'');stage.dataset.step=String(step);
    updateMedia(scene);backButton.disabled=step===-1;
    progress.textContent=step<0?'PROLOGUE':step<=4?`STORY ${String(step+1).padStart(2,'0')} / 05`:step===4.5?'THEIR NEXT CHAPTER':step<=7?`CHOICE 0${step-4} / 03`:step===8?'FREE LIVE CLASS':step===9?'NEXT CHAPTER':'TO BE CONTINUED';
    if(step===-1){setScreen('title');button('.mg-start',next);button('.mg-text-button',()=>go(5))}
    else if(step<=4)setStory();else if(step===4.5)setReviews();else if(step<=7)setQuestion();else if(step===8)setInvitation();else if(step===9)setForm();else setCompletion();
    if(step===1||step===4)deposit();
    const heading=screen.querySelector('h1[tabindex],h2[tabindex]');heading?.focus({preventScroll:true});screen.querySelector('.mg-contact-scroll')?.scrollTo({top:0});
  }
  backButton.addEventListener('click',back);homeButton.addEventListener('click',home);
  document.querySelector('.mg-root').addEventListener('keydown',event=>{if(event.repeat&&(event.key==='Enter'||event.key===' '))event.preventDefault()});
  query.addEventListener('change',()=>{motion=!query.matches;cancelAnimationFrame(frame);typing=false;updateAtmosphere();render()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeVideo&&motion)activeVideo.play().catch(()=>{})});
  window.addEventListener('message', event => {
    if(event.origin !== location.origin || !event.data || typeof event.data.type !== 'string') return;
    if(event.data.type === 'amag-saju:done') { applying = false; go(10); }
    else if(event.data.type === 'amag-saju:idle') { applying = false; setApplying(false); }
  });
  updateAtmosphere();
  if(location.hash === '#done') go(10); else render();
})();
</script></body></html>
